function getLogoHTML(ticker) {
  const info = COMPANY_MAP[ticker];
  if (info) {
    const [domain, name] = info;
    return {
      html: `<div class="company-logo"><img src="https://logo.clearbit.com/${domain}" alt="${ticker}" onerror="this.parentElement.textContent='${ticker.slice(0,3)}'"></div>`,
      name: name
    };
  }
  return {
    html: `<div class="company-logo">${ticker.slice(0, 3)}</div>`,
    name: ''
  };
}

async function startScan() {
  const btn    = document.getElementById('scanBtn');
  const prog   = document.getElementById('progress');
  const board  = document.getElementById('board');
  const dot    = document.getElementById('statusDot');
  const status = document.getElementById('statusText');

  btn.disabled    = true;
  btn.textContent = '⏳ Scanning…';
  prog.style.display = 'block';
  board.innerHTML    = '';
  dot.className      = 'dot';
  status.textContent = 'Scanning Reddit — please wait…';

  try {
    const res  = await fetch('/api/scan');
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    prog.style.display  = 'none';
    btn.disabled        = false;
    btn.textContent     = '▶ RUN SCAN';
    dot.className       = 'dot live';
    status.textContent  = `${data.scanned_at} · ${data.total_posts} posts · ${data.total_comments} comments · last ${data.hours_back}h`;

    renderBoard(data.results);
  } catch(e) {
    prog.style.display  = 'none';
    btn.disabled        = false;
    btn.textContent     = '▶ RUN SCAN';
    status.textContent  = 'Error — try again';
    board.innerHTML     = `<div class="empty"><div class="empty-icon">⚠️</div>${e.message || 'Scan failed. Try again.'}</div>`;
  }
}

function renderBoard(results) {
  const board = document.getElementById('board');

  if (!results || results.length === 0) {
    board.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>No bullish signals found in the last 24h.</div>`;
    return;
  }

  const maxScore = results[0].score;
  let html = `<div class="board-header">Bullish Momentum · Top ${results.length} · Last 24h</div>`;

  results.forEach((item, i) => {
    const pct          = Math.round((item.score / maxScore) * 100);
    const { html: logoHTML, name: companyName } = getLogoHTML(item.ticker);
    const sources      = item.sources.map(s => `<span class="source-tag">r/${s}</span>`).join('');
    const snippet      = item.snippet ? `<div class="snippet">"${item.snippet}"</div>` : '';
    const link         = item.link ? `<a class="card-link" href="${item.link}" target="_blank">View Reddit thread</a>` : '';
    const nameHTML     = companyName ? `<div class="company-name">${companyName}</div>` : '';

    html += `
      <div class="card" style="animation-delay:${i * 60}ms">
        <div class="card-top">
          ${logoHTML}
          <div class="ticker-block">
            <span class="rank">#${item.rank}</span>
            <div class="ticker">$${item.ticker}</div>
            ${nameHTML}
          </div>
          <div class="score-box">
            <span class="score-num">${item.score}</span>
            <span class="score-label">score</span>
          </div>
        </div>
        <div class="momentum-wrap">
          <div class="momentum-track">
            <div class="momentum-fill" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="mentions-badge">${item.mentions} mention${item.mentions !== 1 ? 's' : ''}</span>
          ${sources}
        </div>
        ${snippet}
        ${link}
      </div>`;
  });

  board.innerHTML = html;
}
