<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketScanner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080c10;
    --surface:   #0e1419;
    --surface2:  #111820;
    --border:    #1c2530;
    --green:     #00ff9d;
    --green-dim: #00c97a;
    --amber:     #ffb300;
    --muted:     #4a6070;
    --text:      #c8d8e4;
    --white:     #eef4f8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
    padding-bottom: 48px;
  }

  header {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--white);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--green); }

  .scan-btn {
    background: var(--green);
    color: #000;
    border: none;
    padding: 10px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .scan-btn:hover   { opacity: 0.85; }
  .scan-btn:active  { transform: scale(0.97); }
  .scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status-bar {
    padding: 8px 16px;
    font-size: 10px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot { width:6px; height:6px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.live { background:var(--green); box-shadow:0 0 6px var(--green); }

  #progress { display:none; padding:48px 16px; text-align:center; }

  .spinner {
    width:32px; height:32px;
    border:2px solid var(--border);
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 16px;
  }

  @keyframes spin { to { transform:rotate(360deg); } }

  .progress-text { color:var(--green); font-size:11px; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #board { padding:12px 16px; }

  .board-header {
    font-size:10px; letter-spacing:2px; color:var(--muted);
    text-transform:uppercase; padding-bottom:10px;
    border-bottom:1px solid var(--border); margin-bottom:10px;
  }

  /* ── CARD ── */
  .card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
    animation:fadeUp 0.3s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .card-top {
    display:flex; align-items:center; gap:12px;
    padding:14px 14px 10px;
  }

  /* Logo */
  .company-logo {
    width:40px; height:40px; border-radius:8px;
    background:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family:'Syne',sans-serif;
    font-size:10px; font-weight:800; color:#333;
  }
  .company-logo img { width:100%; height:100%; object-fit:contain; padding:4px; }
  .company-logo.fallback { background:var(--border); color:var(--muted); }

  .ticker-block { flex:1; min-width:0; }
  .rank { font-size:9px; color:var(--muted); display:block; margin-bottom:1px; }
  .ticker { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; color:var(--white); letter-spacing:-0.5px; line-height:1; }
  .company-name { font-size:10px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .score-box { text-align:right; flex-shrink:0; }
  .score-num { font-size:20px; font-weight:600; color:var(--green); display:block; line-height:1; }
  .score-label { font-size:9px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }

  .momentum-wrap { padding:0 14px 10px 66px; }
  .momentum-track { background:var(--border); border-radius:2px; height:3px; overflow:hidden; }
  .momentum-fill { height:100%; background:linear-gradient(90deg,var(--green-dim),var(--green)); border-radius:2px; transition:width 0.6s ease; }

  .card-meta { padding:0 14px 10px 66px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .mentions-badge { background:#0e2a1f; color:var(--green-dim); padding:2px 8px; border-radius:3px; font-size:10px; border:1px solid #1a4030; }
  .source-tag { color:var(--muted); font-size:10px; background:var(--border); padding:2px 6px; border-radius:3px; }

  /* ── THREADS SECTION ── */
  .threads-toggle {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px;
    border-top:1px solid var(--border);
    cursor:pointer;
    font-size:11px;
    color:var(--muted);
    user-select:none;
    transition:background 0.15s;
  }
  .threads-toggle:hover { background:#0c1520; }
  .threads-toggle .arrow { font-size:10px; transition:transform 0.2s; }
  .threads-toggle.open .arrow { transform:rotate(180deg); }

  .threads-list { display:none; }
  .threads-list.open { display:block; }

  .thread-item {
    padding:10px 14px 10px 14px;
    border-top:1px solid var(--border);
    background:var(--surface2);
  }

  .thread-title {
    display:block;
    color:var(--amber);
    text-decoration:none;
    font-size:11px;
    line-height:1.5;
    margin-bottom:4px;
  }
  .thread-title:hover { text-decoration:underline; }

  .thread-meta {
    font-size:10px;
    color:var(--muted);
    margin-bottom:4px;
  }

  .thread-snippet {
    font-size:10px;
    color:#567080;
    line-height:1.5;
    font-style:italic;
  }

  .empty { text-align:center; padding:48px 16px; color:var(--muted); }
  .empty-icon { font-size:32px; margin-bottom:12px; }

  footer { text-align:center; padding:24px 16px 0; font-size:10px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">MARKET<span>SCAN</span></div>
  <button class="scan-btn" id="scanBtn" onclick="startScan()">▶ RUN SCAN</button>
</header>

<div class="status-bar">
  <div class="dot" id="statusDot"></div>
  <span id="statusText">Ready — press RUN SCAN</span>
</div>

<div id="progress">
  <div class="spinner"></div>
  <div class="progress-text">Scanning Reddit · this takes ~60s</div>
</div>

<div id="board"></div>

<footer>NFA · for research only · data via Arctic Shift / Reddit</footer>

<script>
// Ticker → [domain, company name]
const COMPANY_MAP = {
  AAPL:['apple.com','Apple'],           MSFT:['microsoft.com','Microsoft'],
  GOOGL:['google.com','Alphabet'],      GOOG:['google.com','Alphabet'],
  AMZN:['amazon.com','Amazon'],         NVDA:['nvidia.com','NVIDIA'],
  META:['meta.com','Meta'],             TSLA:['tesla.com','Tesla'],
  AVGO:['broadcom.com','Broadcom'],     TSM:['tsmc.com','TSMC'],
  ORCL:['oracle.com','Oracle'],         ASML:['asml.com','ASML'],
  AMD:['amd.com','AMD'],                QCOM:['qualcomm.com','Qualcomm'],
  INTC:['intel.com','Intel'],           AMAT:['appliedmaterials.com','Applied Materials'],
  MU:['micron.com','Micron'],           ARM:['arm.com','ARM'],
  SMCI:['supermicro.com','Super Micro'],MRVL:['marvell.com','Marvell'],
  KLAC:['kla.com','KLA'],               LRCX:['lamresearch.com','Lam Research'],
  JPM:['jpmorganchase.com','JPMorgan'], BAC:['bankofamerica.com','Bank of America'],
  GS:['goldmansachs.com','Goldman'],    MS:['morganstanley.com','Morgan Stanley'],
  WFC:['wellsfargo.com','Wells Fargo'], V:['visa.com','Visa'],
  MA:['mastercard.com','Mastercard'],   PYPL:['paypal.com','PayPal'],
  BRK:['berkshirehathaway.com','Berkshire'],
  UNH:['unitedhealthgroup.com','UnitedHealth'],
  JNJ:['jnj.com','J&J'],               LLY:['lilly.com','Eli Lilly'],
  PFE:['pfizer.com','Pfizer'],          ABBV:['abbvie.com','AbbVie'],
  MRK:['merck.com','Merck'],            XOM:['exxonmobil.com','ExxonMobil'],
  CVX:['chevron.com','Chevron'],        COP:['conocophillips.com','ConocoPhillips'],
  WMT:['walmart.com','Walmart'],        COST:['costco.com','Costco'],
  AMGN:['amgen.com','Amgen'],           NFLX:['netflix.com','Netflix'],
  DIS:['disney.com','Disney'],          CRM:['salesforce.com','Salesforce'],
  ADBE:['adobe.com','Adobe'],           NOW:['servicenow.com','ServiceNow'],
  PLTR:['palantir.com','Palantir'],     SNOW:['snowflake.com','Snowflake'],
  UBER:['uber.com','Uber'],             ABNB:['airbnb.com','Airbnb'],
  SHOP:['shopify.com','Shopify'],       COIN:['coinbase.com','Coinbase'],
  BA:['boeing.com','Boeing'],           CAT:['caterpillar.com','Caterpillar'],
  GE:['ge.com','GE'],                   F:['ford.com','Ford'],
  GM:['gm.com','General Motors'],       RIVN:['rivian.com','Rivian'],
  NIO:['nio.com','NIO'],                BABA:['alibaba.com','Alibaba'],
  NFLX:['netflix.com','Netflix'],       SPOT:['spotify.com','Spotify'],
  HOOD:['robinhood.com','Robinhood'],   SQ:['squareup.com','Block'],
  SPY:['ssga.com','S&P 500 ETF'],       QQQ:['invesco.com','Nasdaq ETF'],
};

function getLogo(ticker) {
  const info = COMPANY_MAP[ticker];
  if (info) {
    const [domain, name] = info;
    // Use logo.dev — more reliable than Clearbit
    const src = `https://img.logo.dev/${domain}?token=pk_X8dRQCCkT0KAqEVi4fCSmA`;
    return { logoHTML: `<div class="company-logo"><img src="${src}" alt="${ticker}" onerror="this.parentElement.className='company-logo fallback';this.parentElement.textContent='${ticker.slice(0,3)}'"></div>`, name };
  }
  return { logoHTML: `<div class="company-logo fallback">${ticker.slice(0,3)}</div>`, name: '' };
}

function toggleThreads(id) {
  const btn  = document.getElementById('toggle-' + id);
  const list = document.getElementById('threads-' + id);
  const open = list.classList.toggle('open');
  btn.classList.toggle('open', open);
}

async function startScan() {
  const btn    = document.getElementById('scanBtn');
  const prog   = document.getElementById('progress');
  const board  = document.getElementById('board');
  const dot    = document.getElementById('statusDot');
  const status = document.getElementById('statusText');

  btn.disabled = true;
  btn.textContent = '⏳ Scanning…';
  prog.style.display = 'block';
  board.innerHTML = '';
  dot.className = 'dot';
  status.textContent = 'Scanning Reddit — please wait…';

  try {
    const res  = await fetch('/api/scan');
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    prog.style.display = 'none';
    btn.disabled = false;
    btn.textContent = '▶ RUN SCAN';
    dot.className = 'dot live';
    status.textContent = `${data.scanned_at} · ${data.total_posts} posts · ${data.total_comments} comments · last ${data.hours_back}h`;

    renderBoard(data.results);
  } catch(e) {
    prog.style.display = 'none';
    btn.disabled = false;
    btn.textContent = '▶ RUN SCAN';
    status.textContent = 'Error — try again';
    board.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${e.message || 'Scan failed.'}</div>`;
  }
}

function renderBoard(results) {
  const board = document.getElementById('board');

  if (!results || results.length === 0) {
    board.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>No bullish signals found in the last 24h.</div>`;
    return;
  }

  const maxScore = results[0].score;
  let html = `<div class="board-header">Bullish Momentum · Top ${results.length} · Last 24h</div>`;

  results.forEach((item, i) => {
    const pct              = Math.round((item.score / maxScore) * 100);
    const { logoHTML, name } = getLogo(item.ticker);
    const sources          = item.sources.map(s => `<span class="source-tag">r/${s}</span>`).join('');
    const nameHTML         = name ? `<div class="company-name">${name}</div>` : '';
    const threadCount      = item.threads ? item.threads.length : 0;

    // Build thread list HTML
    let threadsHTML = '';
    if (threadCount > 0) {
      const threadItems = item.threads.map(t => `
        <div class="thread-item">
          <a class="thread-title" href="${t.url}" target="_blank">${t.title}</a>
          <div class="thread-meta">r/${t.sub}</div>
          ${t.snippet ? `<div class="thread-snippet">"${t.snippet}"</div>` : ''}
        </div>`).join('');

      threadsHTML = `
        <div class="threads-toggle" id="toggle-${i}" onclick="toggleThreads(${i})">
          <span>📋 ${threadCount} thread${threadCount !== 1 ? 's' : ''} mentioning $${item.ticker}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="threads-list" id="threads-${i}">
          ${threadItems}
        </div>`;
    }

    html += `
      <div class="card" style="animation-delay:${i * 60}ms">
        <div class="card-top">
          ${logoHTML}
          <div class="ticker-block">
            <span class="rank">#${item.rank}</span>
            <div class="ticker">$${item.ticker}</div>
            ${nameHTML}
          </div>
          <div class="score-box">
            <span class="score-num">${item.score}</span>
            <span class="score-label">score</span>
          </div>
        </div>
        <div class="momentum-wrap">
          <div class="momentum-track">
            <div class="momentum-fill" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="card-meta">
          <span class="mentions-badge">${item.mentions} mention${item.mentions !== 1 ? 's' : ''}</span>
          ${sources}
        </div>
        ${threadsHTML}
      </div>`;
  });

  board.innerHTML = html;
}
</script>

</body>
</html>
